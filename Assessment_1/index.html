<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Silicon Design</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        color: #222;
        background-color: #fff;
        line-height: 1.6;
      }

      /* Header */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 8%;
        background-color: #f5f5f5;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
      }

      nav a {
        margin-left: 20px;
        text-decoration: none;
        color: #222;
      }

      nav a:hover {
        color: #888;
      }

      /* Hero */
      .hero {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 60px 20px;
        background-color: #eaeaea;
      }

      .hero h1 {
        font-size: clamp(2rem, 5vw, 3.5rem);
        margin-bottom: 20px;
      }

      .hero p {
        font-size: 18px;
        max-width: 600px;
        margin-bottom: 30px;
      }

      .hero-button {
        display: inline-block;
        padding: 12px 28px;
        background-color: #222;
        color: #fff;
        text-decoration: none;
        border-radius: 5px;
      }

      .hero-button:hover {
        background-color: #444;
      }

      /* Footer */
      footer {
        text-align: center;
        padding: 25px 20px;
        background-color: #222;
        color: #fff;
      }

      /* Mobil */
      @media (max-width: 600px) {
        header {
          flex-direction: column;
          gap: 15px;
        }

        nav a {
          margin: 0 8px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="logo">Min logotyp</div>

      <nav>
        <a href="#hem">Hem</a>
        <a href="#om">Om</a>
        <a href="#kontakt">Kontakt</a>
      </nav>
    </header>

    <!-- Hero -->
    <main>
      <section class="hero" id="hem">
        <h1>Manage All Your Money in One App</h1>

        <p>
          We offer you a new generation of the mobile banking. Save, spend &
          manage money in your pocket.
        </p>

        <!-- <a href="#kontakt" class="hero-button">Kontakta mig</a>-->
      </section>
    </main>

    <!-- Footer -->
    <footer id="kontakt">
      <p>&copy; © 2025 Silicon. All rights reserved.</p>
    </footer>
  </body>
</html>
